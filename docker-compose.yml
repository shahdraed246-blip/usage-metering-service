services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: metering
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d metering"]
      interval: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/metering
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      API_URL: http://api:3000
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      - api

volumes:
  pgdata:
